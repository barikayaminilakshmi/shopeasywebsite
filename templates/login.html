<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.box{

    width:350px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px #ccc;

}


input{

    width:100%;
    padding:12px;
    margin:10px 0;

}


button{

    width:100%;
    padding:12px;
    background:#131921;
    color:white;
    border:none;
    cursor:pointer;

}


button:hover{

    background:#f0c14b;
    color:black;

}


a{

    text-decoration:none;

}

</style>

</head>


<body>


<div class="box">


<h2 align="center">
Login
</h2>


<form method="POST">

{% csrf_token %}


<input 
type="text"
name="username"
placeholder="Username"
required
>


<input 
type="password"
name="password"
placeholder="Password"
required
>


<button type="submit">
Login
</button>


</form>


<p align="center">

Don't have account?

<a href="/register/">
Register
</a>

</p>


</div>


</body>

</html>
